<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room - Prova</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center,#333 0%,#111 55%,#000 100%);
    color:#eee;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* Leggera nebbia */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
        repeating-radial-gradient(circle at center,
        rgba(255,255,255,.02) 0px,
        rgba(255,255,255,.02) 2px,
        transparent 4px,
        transparent 8px);
    animation:fog 18s linear infinite;
    opacity:.4;
}

@keyframes fog{
    from{transform:translateX(-50px);}
    to{transform:translateX(50px);}
}

.container{
    position:relative;
    z-index:2;
    width:380px;
    padding:35px;
    background:rgba(15,15,15,.92);
    border:3px solid #7b5b2a;
    border-radius:12px;
    box-shadow:
        0 0 25px rgba(255,180,0,.25),
        inset 0 0 20px rgba(255,255,255,.03);
    text-align:center;
}

h1{
    font-family:'Cinzel',serif;
    color:#d8b66a;
    margin-bottom:10px;
    letter-spacing:2px;
}

.subtitle{
    color:#bbb;
    margin-bottom:25px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    background:#1c1c1c;
    border:2px solid #5d4724;
    color:#fff;
    font-size:18px;
    text-align:center;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#d8b66a;
    box-shadow:0 0 15px rgba(216,182,106,.5);
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#8d672d;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

button:hover{
    background:#b4873e;
    transform:scale(1.03);
}

#messaggio{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    min-height:60px;
}

.successo{
    color:#57ff7a;
    text-shadow:0 0 10px #00ff55;
}

.errore{
    color:#ff5757;
    text-shadow:0 0 10px red;
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#777;
    font-style:italic;
}
</style>

</head>
<body>

<div class="container">

<h1>🔐 ESCAPE ROOM</h1>

<div class="subtitle">
Inserisci la parola segreta per sbloccare la prossima prova.
</div>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="controllaPassword()">
🔓 SBLOCCA
</button>

<div id="messaggio"></div>

<div class="footer">
"La chiave è nascosta davanti ai tuoi occhi..."
</div>

</div>

<script>

function controllaPassword(){

    const password = document.getElementById("password").value
        .trim()
        .toUpperCase();

    const messaggio = document.getElementById("messaggio");

    if(password==="CAFFE"){

        messaggio.className="successo";

        messaggio.innerHTML=
        "🎉 COMPLIMENTI!<br><br>" +
        "Hai superato la prova.<br>" +
        "Passi alla prossima sfida:<br><br>" +
        "<strong>👉 Titolo della prova</strong>";

    }else{

        messaggio.className="errore";

        messaggio.innerHTML=
        "☠ Password errata.<br><br>" +
        "Ritenta... sarai più fortunato!";
    }

}

</script>

</body>
</html>
