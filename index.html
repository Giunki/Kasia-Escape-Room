<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room Challenge</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle, #333 0%, #111 55%, #000 100%);
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: repeating-radial-gradient(
        circle,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 5px,
        transparent 10px
    );
    animation: fog 15s linear infinite;
}

@keyframes fog {
    from {
        transform: translateX(-40px);
    }
    to {
        transform: translateX(40px);
    }
}

.container {
    position: relative;
    z-index: 2;
    width: 380px;
    padding: 35px;
    background: rgba(10,10,10,0.95);
    border: 3px solid #8b6b32;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,180,0,0.3);
}

h1 {
    font-family: 'Cinzel', serif;
    color: #d8b66a;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.subtitle {
    color: #ccc;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    background: #1b1b1b;
    border: 2px solid #6d5125;
    border-radius: 8px;
    color: white;
    text-align: center;
    font-size: 18px;
}

input:focus {
    outline: none;
    border-color: #d8b66a;
    box-shadow: 0 0 15px #d8b66a;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #8b642c;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #b98a42;
}

#messaggio {
    margin-top: 25px;
    min-height: 60px;
    font-size: 20px;
    font-weight: bold;
}

.successo {
    color: #5cff7a;
    text-shadow: 0 0 10px green;
}

.errore {
    color: #ff5555;
    text-shadow: 0 0 10px red;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #777;
    font-style: italic;
}

</style>
</head>

<body>

<div class="container">

<h1>🔐 ESCAPE ROOM</h1>

<div class="subtitle">
Enter the secret password to unlock the next challenge.<br>
The password is made of <strong>5 letters</strong>.
</div>

<input type="password" id="password" placeholder="Enter password">

<button onclick="checkPassword()">
🔓 UNLOCK
</button>

<div id="messaggio"></div>

<div class="footer">
"The key is hidden right in front of your eyes..."
</div>

</div>


<script>

function checkPassword() {

    const password = document
        .getElementById("password")
        .value
        .trim()
        .toUpperCase();

    const messaggio = document.getElementById("messaggio");


    if (password === "CAFFE") {

        messaggio.className = "successo";

        messaggio.innerHTML =
        "🎉 CONGRATULATIONS!<br><br>" +
        "You passed the challenge.<br>" +
        "You can move to the next test:<br><br>" +
        "<strong>👉 NEXT CHALLENGE TITLE</strong>";

    } else {

        messaggio.className = "errore";

        messaggio.innerHTML =
        "☠ WRONG PASSWORD!<br><br>" +
        "Try again... better luck next time!";

    }

}

</script>

</body>
</html>
